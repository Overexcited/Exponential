name: Build Eigent Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EIGENT_REF: v1.0.2
  LLAMA_REF: master
  # Production builds should replace master with a reviewed immutable commit.
  BUILD_SOURCE_DATE_EPOCH: 0

jobs:
  llama-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_REF }}
          path: llama.cpp

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and native build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build llama-server for arm64-v8a
        working-directory: llama.cpp
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF
          cmake --build build-android --target llama-server -j 2
          mkdir -p "$GITHUB_WORKSPACE/llama-artifact"
          cp build-android/bin/llama-server "$GITHUB_WORKSPACE/llama-artifact/libllama-server.so"
          chmod 755 "$GITHUB_WORKSPACE/llama-artifact/libllama-server.so"

      - name: Upload llama-server
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-arm64
          path: llama-artifact/libllama-server.so

  android:
    needs: llama-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download llama-server
        uses: actions/download-artifact@v4
        with:
          name: llama-server-arm64
          path: app/src/main/jniLibs/arm64-v8a

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .build/upstream/eigent/package-lock.json

      - name: Prepare Eigent upstream
        run: ./scripts/prepare_upstream.sh

      - name: Build Eigent web frontend
        working-directory: .build/upstream/eigent
        env:
          VITE_BASE_URL: http://127.0.0.1:5001
          VITE_PROXY_URL: http://127.0.0.1:5001
          VITE_USE_LOCAL_PROXY: 'false'
        run: |
          npm ci
          npm run build:web
          rm -rf "$GITHUB_WORKSPACE/app/src/main/assets/eigent-web"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/eigent-web"
          cp -a dist-web/. "$GITHUB_WORKSPACE/app/src/main/assets/eigent-web/"

      - name: Copy backend
        run: |
          rm -rf app/src/main/python/eigent-backend
          mkdir -p app/src/main/python/eigent-backend
          cp -a .build/upstream/eigent/backend/. app/src/main/python/eigent-backend/

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify native library page alignment
        run: |
          file app/src/main/jniLibs/arm64-v8a/libllama-server.so || true
          readelf -l app/src/main/jniLibs/arm64-v8a/libllama-server.so 2>/dev/null | grep -E "LOAD|Align" || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eigent-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
